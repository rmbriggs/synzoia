name: synzoia
options:
  bundleIdPrefix: com.synzoia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  synzoia:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.synzoia.ios
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES

schemes:
  synzoia:
    build:
      targets:
        synzoia: all
    run:
      config: Debug
