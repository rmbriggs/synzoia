name: synzoia
options:
  bundleIdPrefix: com.synzoia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  synzoia:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Fonts
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.synzoia.ios
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Sources/synzoia.entitlements

  synzoiaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.synzoia.ios.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: synzoia

schemes:
  synzoia:
    build:
      targets:
        synzoia: all
        synzoiaTests: [test]
    run:
      config: Debug
    test:
      targets:
        - synzoiaTests
